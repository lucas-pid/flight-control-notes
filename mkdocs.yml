# Site metadata
site_name: Engineering Notes
site_description: Personal engineering reference — class notes, MATLAB/Simulink, flight control, Git, and snippets.
site_author: Your Name
site_url: https://YOUR-USERNAME.github.io/YOUR-REPO/

# Repository info (used by theme for "Edit this page" links — update these)
repo_url: https://github.com/YOUR-USERNAME/YOUR-REPO
repo_name: GitHub
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  # Light theme by default. Single palette = no dark-mode toggle, keeps it simple.
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.sections      # group top-level sections without deep nesting
    - navigation.indexes       # attach index.md to the section header (no duplicate entry)
    - navigation.expand        # keep sidebar categories expanded
    - navigation.top           # back-to-top button
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

# Navigation — fully automatic via awesome-pages.
# Do NOT list pages here. New .md files under docs/ appear automatically.
# Order and section titles are set in docs/.pages and docs/*/[.]pages files.

# Markdown extensions — only what technical notes need
markdown_extensions:
  - admonition                    # !!! note / warning boxes
  - attr_list                     # {#anchors} and {: .classes}
  - def_list                      # definition lists
  - footnotes                     # [^1] references
  - md_in_html                    # markdown inside HTML blocks
  - tables                        # standard tables
  - abbr                          # *[HTML]: abbreviation
  - toc:
      permalink: true             # automatic heading anchors (¶ link on each heading)
  - pymdownx.arithmatex:
      generic: true               # MathJax for $...$ and $$...$$ without raw HTML
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.superfences           # fenced code blocks, nesting, highlighting
  - pymdownx.tasklist:
      custom_checkbox: true       # - [x] task lists

# Plugins — keep to the minimum
plugins:
  - search                        # built-in client-side search, no external service
  - awesome-pages                 # auto-discover new .md files (no nav edits needed)

# Math rendering (lightweight, well-supported)
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# No custom CSS by default. If you ever need a tiny tweak,
# uncomment the line below and put rules in docs/stylesheets/extra.css.
# extra_css:
#   - stylesheets/extra.css

# Validation — fail the build on broken internal links/images
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
